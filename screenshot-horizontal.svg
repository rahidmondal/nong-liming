<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title">
  <title>NongLiMing Horizontal Screenshot</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f1a" />
      <stop offset="100%" stop-color="#1b2435" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd89e" />
      <stop offset="100%" stop-color="#ffc978" />
    </linearGradient>
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#ffc978" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg)" />
  <!-- Decorative circles -->
  <circle cx="260" cy="220" r="150" fill="#ffc978" opacity="0.16" />
  <circle cx="1640" cy="240" r="190" fill="#56b3ff" opacity="0.12" />
  <circle cx="1700" cy="800" r="120" fill="#ffc978" opacity="0.1" />
  <circle cx="180" cy="850" r="100" fill="#56b3ff" opacity="0.08" />
  <!-- Main content card -->
  <rect x="220" y="200" width="1480" height="680" rx="64" fill="#111827" opacity="0.7" />
  <!-- Logo container with Thai letter น -->
  <circle cx="960" cy="360" r="100" fill="#1b2435" />
  <circle cx="960" cy="360" r="80" fill="#ffc978" opacity="0.15" />
  <text x="960" y="395" text-anchor="middle" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="100" font-weight="700" fill="url(#goldGlow)" filter="url(#logoShadow)">น</text>
  <!-- App name -->
  <text x="960" y="530" text-anchor="middle" font-family="Sarabun, 'Segoe UI', sans-serif" font-size="72" font-weight="700" fill="#f7f4ef">
    NongLiMing
  </text>
  <text x="960" y="600" text-anchor="middle" font-family="Sarabun, 'Segoe UI', sans-serif" font-size="36" fill="#cbd5f5">
    Learn Thai Consonants the Indic Way
  </text>
  <!-- Feature cards -->
  <rect x="340" y="680" width="360" height="120" rx="24" fill="#1b2435" />
  <circle cx="400" cy="740" r="30" fill="#ffc978" opacity="0.3"/>
  <text x="450" y="750" font-family="Sarabun, 'Segoe UI', sans-serif" font-size="28" fill="#f7f4ef">Varnamala Grid</text>

  <rect x="780" y="680" width="360" height="120" rx="24" fill="#1b2435" />
  <circle cx="840" cy="740" r="30" fill="#56b3ff" opacity="0.3"/>
  <text x="890" y="750" font-family="Sarabun, 'Segoe UI', sans-serif" font-size="28" fill="#f7f4ef">Drill Cards</text>

  <rect x="1220" y="680" width="360" height="120" rx="24" fill="#1b2435" />
  <circle cx="1280" cy="740" r="30" fill="#ffc978" opacity="0.3"/>
  <text x="1330" y="750" font-family="Sarabun, 'Segoe UI', sans-serif" font-size="28" fill="#f7f4ef">Progress Track</text>
</svg>
