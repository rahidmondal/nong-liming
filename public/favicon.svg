<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-labelledby="title">
  <title>NongLiming Favicon</title>
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd89e" />
      <stop offset="100%" stop-color="#ffc978" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#0b0f1a" />
  <!-- Inner glow -->
  <circle cx="16" cy="16" r="12" fill="#ffc978" opacity="0.15" />
  <!-- Thai letter น -->
  <text
    x="16"
    y="22"
    font-family="Sarabun, 'Noto Sans Thai', sans-serif"
    font-size="16"
    font-weight="700"
    fill="url(#goldGrad)"
    text-anchor="middle"
  >น</text>
</svg>
