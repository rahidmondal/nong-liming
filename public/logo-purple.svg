<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title>NongLiming App Icon</title>
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c49bff" />
      <stop offset="100%" stop-color="#8a2be2" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0e6ff" />
      <stop offset="100%" stop-color="#c49bff" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#c49bff" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="#19171c" />
  <!-- Outer glow ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#glow)" stroke-width="3" opacity="0.4"/>
  <!-- Inner decorative ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#c49bff" stroke-width="2" opacity="0.25"/>
  <!-- Glowing background circle -->
  <circle cx="256" cy="256" r="130" fill="url(#glow)" opacity="0.15" />
  <!-- Main card background -->
  <rect x="116" y="116" width="280" height="280" rx="48" fill="#25212c" filter="url(#shadow)"/>
  <!-- Decorative corner accents -->
  <path d="M140 140 L140 180 Q140 140 180 140 Z" fill="#c49bff" opacity="0.3"/>
  <path d="M372 140 L332 140 Q372 140 372 180 Z" fill="#8a2be2" opacity="0.3"/>
  <path d="M140 372 L140 332 Q140 372 180 372 Z" fill="#8a2be2" opacity="0.3"/>
  <path d="M372 372 L332 372 Q372 372 372 332 Z" fill="#c49bff" opacity="0.3"/>
  <!-- Thai letter น -->
  <text
    x="256"
    y="300"
    font-family="Sarabun, 'Noto Sans Thai', 'Segoe UI', sans-serif"
    font-size="160"
    font-weight="700"
    fill="url(#innerGlow)"
    text-anchor="middle"
    filter="url(#shadow)"
  >น</text>
  <!-- Subtle underline decoration -->
  <rect x="186" y="340" width="140" height="4" rx="2" fill="url(#glow)" opacity="0.6"/>
</svg>
