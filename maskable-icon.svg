<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title>NongLiming Maskable Icon</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f1a" />
      <stop offset="100%" stop-color="#1b2435" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd89e" />
      <stop offset="100%" stop-color="#ffc978" />
    </linearGradient>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#ffc978" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Solid background for maskable -->
  <rect width="512" height="512" fill="url(#bgGrad)" />
  <!-- Outer decorative circle -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#ffc978" stroke-width="2" opacity="0.2"/>
  <!-- Inner glow circles -->
  <circle cx="256" cy="256" r="160" fill="#1b2435" />
  <circle cx="256" cy="256" r="140" fill="#ffc978" opacity="0.12" />
  <circle cx="256" cy="256" r="100" fill="#56b3ff" opacity="0.08" />
  <!-- Thai letter น -->
  <text
    x="256"
    y="295"
    font-family="Sarabun, 'Noto Sans Thai', 'Segoe UI', sans-serif"
    font-size="140"
    font-weight="700"
    fill="url(#goldGlow)"
    text-anchor="middle"
    filter="url(#textGlow)"
  >น</text>
  <!-- Bottom decorative arc -->
  <path d="M186 330 Q256 360 326 330" fill="none" stroke="#ffc978" stroke-width="3" opacity="0.4"/>
</svg>
